<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Failure Simulator</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Control Bar */
        header {
            background: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            z-index: 10;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #0f172a;
        }

        .btn-help {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-help:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background: #ffffff;
            border: 2px solid #0f172a;
            border-radius: 6px;
            width: 460px;
            max-width: 90vw;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .modal-header-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
        }

        .page-indicator {
            font-size: 11px;
            font-weight: 600;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .modal-body {
            font-size: 13px;
            line-height: 1.5;
            color: #334155;
        }

        .modal-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dont-show {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #64748b;
            cursor: pointer;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .control-item label {
            color: #475569;
        }

        .control-item .val {
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-weight: 700;
            color: #0f172a;
            min-width: 32px;
        }

        select, input[type="range"] {
            font-family: inherit;
            font-size: 12px;
            padding: 4px 8px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            color: #0f172a;
            outline: none;
        }

        select:focus {
            border-color: #0f172a;
        }

        input[type="range"] {
            padding: 0;
            height: 6px;
            accent-color: #0f172a;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .btn {
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 4px;
            border: 1px solid #0f172a;
            background: #ffffff;
            color: #0f172a;
            cursor: pointer;
            transition: background 0.1s, color 0.1s, border-color 0.1s;
        }

        .btn:hover {
            background: #f1f5f9;
        }

        .btn-primary {
            background: #0f172a;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1e293b;
        }

        .btn-danger {
            background: #dc2626;
            border-color: #dc2626;
            color: #ffffff;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-mode {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #475569;
        }

        .btn-mode.active {
            background: #0f172a;
            border-color: #0f172a;
            color: #ffffff;
        }

        /* Workspace Grid */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            background: #f8fafc;
        }

        #canvas {
            width: 100%;
            height: 100%;
        }

        /* Graph SVG Elements */
        .edge {
            stroke: #cbd5e1;
            stroke-width: 1.8px;
            transition: stroke 0.15s, stroke-width 0.15s, opacity 0.15s;
        }

        .edge.hover-cut {
            stroke: #ef4444 !important;
            stroke-width: 3px !important;
            cursor: pointer;
        }

        .edge.severed {
            stroke: #94a3b8;
            stroke-dasharray: 4,4;
            stroke-width: 1.5px;
            opacity: 0.35;
        }

        .node {
            stroke: #ffffff;
            stroke-width: 2px;
            cursor: pointer;
            transition: fill 0.2s, r 0.2s;
        }

        .flow-particle {
            pointer-events: none;
            filter: drop-shadow(0 0 3px rgba(245, 158, 11, 0.8));
        }

        /* Bottom Telemetry Bar */
        footer {
            background: #ffffff;
            border-top: 2px solid #e2e8f0;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            font-size: 13px;
        }

        .metrics-group {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .metrics {
            display: flex;
            gap: 20px;
        }

        .metric-unit {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .metric-unit .lbl {
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .metric-unit .num {
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
        }

        .metric-unit .num.danger {
            color: #dc2626;
        }

        /* Live Trajectory Mini Chart */
        .chart-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            padding: 4px 10px;
        }

        .chart-box .chart-lbl {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            writing-mode: horizontal-tb;
        }

        #chart-svg {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 3px;
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: #475569;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: #0f172a;
            color: #ffffff;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            z-index: 20;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-area">
            <div class="brand">Cascading Failure Simulator</div>
            <button class="btn-help" id="btn-open-help" title="What is this?">?</button>
        </div>

        <div class="controls">
            <div class="control-item">
                <label for="preset">Preset</label>
                <select id="preset">
                    <option value="custom">Custom Settings</option>
                    <option value="scale_free_hub">Scale-Free Hub Attack (BA)</option>
                    <option value="low_buffer_crash">Low-Buffer Grid Crash (ER, α=0.02)</option>
                    <option value="resilient_small_world">Resilient Small World (WS, α=0.30)</option>
                </select>
            </div>

            <div class="control-item">
                <label for="topology">Topology</label>
                <select id="topology">
                    <option value="barabasi_albert">Barabási–Albert (Scale-Free)</option>
                    <option value="erdos_renyi">Erdős–Rényi (Random)</option>
                    <option value="watts_strogatz">Watts–Strogatz (Small World)</option>
                </select>
            </div>

            <div class="control-item">
                <label for="nodes">Nodes</label>
                <input type="range" id="nodes" min="20" max="150" value="80">
                <span id="nodes-val" class="val">80</span>
            </div>

            <div class="control-item">
                <label for="alpha">Buffer (α)</label>
                <input type="range" id="alpha" min="0.0" max="0.5" step="0.02" value="0.15">
                <span id="alpha-val" class="val">0.15</span>
            </div>

            <div class="control-item">
                <label for="attack">Attack Strategy</label>
                <select id="attack">
                    <option value="target_hub">Target Hub (Max Degree)</option>
                    <option value="random">Random Node</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn btn-mode active" id="btn-mode-shock" title="Click nodes to shock/fail them">Shock ⚡</button>
                <button class="btn btn-mode" id="btn-mode-cut" title="Click links to isolate/sever them">Cut Link ✂️</button>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btn-init" title="Reset network state (Shortcut: R)">Reset</button>
                <button class="btn btn-danger" id="btn-attack">Attack</button>
                <button class="btn" id="btn-step" title="Advance one step (Shortcut: S)">Step (t+1)</button>
                <button class="btn" id="btn-play" title="Auto run step loop (Shortcut: Space)">Auto Play</button>
            </div>

            <div class="btn-group">
                <button class="btn" id="btn-export-svg" title="Save SVG Snapshot">Export SVG</button>
                <button class="btn" id="btn-export-json" title="Download Trajectory JSON Log">Export JSON</button>
            </div>
        </div>
    </header>

    <div class="workspace">
        <svg id="canvas"></svg>
        <div id="tooltip" class="tooltip"></div>
    </div>

    <footer>
        <div class="metrics-group">
            <div class="metrics">
                <div class="metric-unit">
                    <span class="lbl">Step:</span>
                    <span id="m-step" class="num">0</span>
                </div>
                <div class="metric-unit">
                    <span class="lbl">Failed:</span>
                    <span id="m-failed" class="num danger">0 / 80 (0.0%)</span>
                </div>
                <div class="metric-unit">
                    <span class="lbl">Giant Component (P<sub>∞</sub>):</span>
                    <span id="m-giant" class="num">1.000</span>
                </div>
            </div>

            <div class="chart-box">
                <span class="chart-lbl">Trajectory:</span>
                <svg id="chart-svg" width="220" height="42"></svg>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="swatch" style="background: #2563eb"></div> Healthy
            </div>
            <div class="legend-item">
                <div class="swatch" style="background: #d97706"></div> Near Capacity (>85%)
            </div>
            <div class="legend-item">
                <div class="swatch" style="background: #dc2626"></div> Failed
            </div>
            <div class="legend-item">
                <div class="swatch" style="background: #94a3b8; border-radius: 0; width: 12px; height: 2px;"></div> Severed Link
            </div>
        </div>
    </footer>

    <!-- Onboarding Multi-Page Modal -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <div class="modal-header-nav">
                <div class="modal-title" id="modal-page-title">What This Simulator Is</div>
                <div class="page-indicator" id="modal-page-indicator">Page 1 of 5</div>
            </div>

            <div class="modal-body" id="modal-page-content">
                <!-- Injected via JavaScript -->
            </div>

            <div class="modal-footer">
                <label class="dont-show">
                    <input type="checkbox" id="chk-dont-show">
                    Don't show again
                </label>
                <div class="btn-group">
                    <button class="btn" id="btn-modal-prev" style="display: none;">Back</button>
                    <button class="btn btn-primary" id="btn-modal-next">Next →</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let nodes = [], links = [];
        let simulation, svg, container;
        let isPlaying = false, timer = null;
        let step = 0;
        let interactionMode = "shock"; // "shock" or "cut"
        let stepHistory = [];

        // Multi-Page Onboarding Modal Logic
        const modalOverlay = document.getElementById("modal-overlay");
        const chkDontShow = document.getElementById("chk-dont-show");
        const btnModalPrev = document.getElementById("btn-modal-prev");
        const btnModalNext = document.getElementById("btn-modal-next");
        const btnOpenHelp = document.getElementById("btn-open-help");

        const pageTitle = document.getElementById("modal-page-title");
        const pageIndicator = document.getElementById("modal-page-indicator");
        const pageContent = document.getElementById("modal-page-content");

        let currentModalPage = 0;

        const modalPages = [
            {
                title: "1. What is a Cascading Failure?",
                content: `
                    <p>In complex networks (like power grids, router backbones, or banking systems), components don't fail in isolation.</p>
                    <br/>
                    <p>When one node fails, its load doesn't disappear—it gets <strong>redistributed to surviving neighbors</strong>. If a neighbor receives too much extra load, it exceeds its capacity threshold and fails too, triggering a self-amplifying <strong>positive feedback cascade</strong>.</p>
                `
            },
            {
                title: "2. Understanding Network Topologies",
                content: `
                    <p>Network structure (topology) shapes how stress propagates:</p>
                    <ul style="margin-left: 18px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
                        <li><strong>Barabási–Albert (Scale-Free):</strong> Dominated by highly connected <em>hubs</em>. Resilient to random faults, but vulnerable to targeted attacks on hubs.</li>
                        <li><strong>Erdős–Rényi (Random):</strong> Uniform connectivity. Shows sudden, abrupt phase transitions once average stress crosses a critical threshold.</li>
                        <li><strong>Watts–Strogatz (Small World):</strong> High local clustering combined with long-range shortcuts.</li>
                    </ul>
                `
            },
            {
                title: "3. Load, Capacity & Tolerance Buffer (α)",
                content: `
                    <p>Every node has two core values:</p>
                    <ul style="margin-left: 18px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
                        <li><strong>Load ($L_i$):</strong> Current traffic/demand handled by the node.</li>
                        <li><strong>Capacity ($C_i$):</strong> Maximum breakdown threshold limit:
                            <div style="background:#f1f5f9; padding:6px; border-radius:4px; font-family:monospace; margin-top:4px;">C_i = (1 + α) × L_i</div>
                        </li>
                        <li><strong>Tolerance Buffer (α):</strong> The safety factor. Below critical threshold <strong>α_c</strong>, cascades collapse the entire network; above <strong>α_c</strong>, the system absorbs shocks.</li>
                    </ul>
                `
            },
            {
                title: "4. Presets & Controls",
                content: `
                    <p>Quick experiment presets & simulation controls:</p>
                    <ul style="margin-left: 18px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
                        <li><strong>Preset Dropdown:</strong> Load classic scenarios like <em>Scale-Free Hub Shock</em> or <em>Low-Buffer Grid Crash</em>.</li>
                        <li><strong>Attack Button:</strong> Strikes the largest hub or a random node.</li>
                        <li><strong>Step / Auto Play:</strong> Advance time step-by-step or auto-run.</li>
                    </ul>
                `
            },
            {
                title: "5. Circuit Breaker & Shortcuts",
                content: `
                    <p>Defense & keyboard shortcuts:</p>
                    <ul style="margin-left: 18px; margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
                        <li><strong>Cut Link Mode (✂️):</strong> Switch mode and click on edges to sever them, preventing load transfer to critical subgraphs!</li>
                        <li><strong>Keyboard Shortcuts:</strong> Press <strong>[Space]</strong> to Play/Pause, <strong>[S]</strong> to Step (t+1), and <strong>[R]</strong> to Reset.</li>
                        <li><strong>Export:</strong> Save SVG images or JSON trajectory logs anytime.</li>
                    </ul>
                `
            }
        ];

        function renderModalPage(index) {
            currentModalPage = index;
            const page = modalPages[index];
            pageTitle.textContent = page.title;
            pageIndicator.textContent = `Page ${index + 1} of ${modalPages.length}`;
            pageContent.innerHTML = page.content;

            btnModalPrev.style.display = index === 0 ? "none" : "inline-block";
            btnModalNext.textContent = index === modalPages.length - 1 ? "Finish & Explore" : "Next →";
        }

        if (localStorage.getItem("hide_intro_dialog") === "true") {
            modalOverlay.style.display = "none";
        } else {
            renderModalPage(0);
        }

        btnOpenHelp.addEventListener("click", () => {
            renderModalPage(0);
            modalOverlay.style.display = "flex";
        });

        btnModalPrev.addEventListener("click", () => {
            if (currentModalPage > 0) renderModalPage(currentModalPage - 1);
        });

        btnModalNext.addEventListener("click", () => {
            if (currentModalPage < modalPages.length - 1) {
                renderModalPage(currentModalPage + 1);
            } else {
                if (chkDontShow.checked) localStorage.setItem("hide_intro_dialog", "true");
                modalOverlay.style.display = "none";
            }
        });

        const viewport = d3.select(".workspace").node();
        const width = viewport.clientWidth;
        const height = viewport.clientHeight;

        svg = d3.select("#canvas").attr("viewBox", [0, 0, width, height]);
        container = svg.append("g");

        svg.call(d3.zoom().scaleExtent([0.3, 4]).on("zoom", (e) => container.attr("transform", e.transform)));

        document.getElementById("nodes").addEventListener("input", (e) => document.getElementById("nodes-val").textContent = e.target.value);
        document.getElementById("alpha").addEventListener("input", (e) => document.getElementById("alpha-val").textContent = parseFloat(e.target.value).toFixed(2));

        // Interaction mode selector
        document.getElementById("btn-mode-shock").addEventListener("click", () => setInteractionMode("shock"));
        document.getElementById("btn-mode-cut").addEventListener("click", () => setInteractionMode("cut"));

        function setInteractionMode(mode) {
            interactionMode = mode;
            document.getElementById("btn-mode-shock").classList.toggle("active", mode === "shock");
            document.getElementById("btn-mode-cut").classList.toggle("active", mode === "cut");
            drawGraph();
        }

        // Preset Scenario Loader
        document.getElementById("preset").addEventListener("change", (e) => {
            const val = e.target.value;
            if (val === "scale_free_hub") {
                document.getElementById("topology").value = "barabasi_albert";
                document.getElementById("nodes").value = "80";
                document.getElementById("nodes-val").textContent = "80";
                document.getElementById("alpha").value = "0.15";
                document.getElementById("alpha-val").textContent = "0.15";
                document.getElementById("attack").value = "target_hub";
            } else if (val === "low_buffer_crash") {
                document.getElementById("topology").value = "erdos_renyi";
                document.getElementById("nodes").value = "80";
                document.getElementById("nodes-val").textContent = "80";
                document.getElementById("alpha").value = "0.02";
                document.getElementById("alpha-val").textContent = "0.02";
                document.getElementById("attack").value = "random";
            } else if (val === "resilient_small_world") {
                document.getElementById("topology").value = "watts_strogatz";
                document.getElementById("nodes").value = "80";
                document.getElementById("nodes-val").textContent = "80";
                document.getElementById("alpha").value = "0.30";
                document.getElementById("alpha-val").textContent = "0.30";
                document.getElementById("attack").value = "random";
            }
            if (val !== "custom") generateNetwork();
        });

        function generateNetwork() {
            const topology = document.getElementById("topology").value;
            const N = parseInt(document.getElementById("nodes").value);
            const alpha = parseFloat(document.getElementById("alpha").value);

            nodes = Array.from({ length: N }, (_, i) => ({ id: i, load: 0, capacity: 0, status: "healthy" }));
            links = [];

            if (topology === "barabasi_albert") {
                let degrees = new Array(N).fill(0);
                for (let i = 0; i < Math.min(3, N); i++) {
                    for (let j = i + 1; j < Math.min(3, N); j++) {
                        links.push({ source: i, target: j, severed: false });
                        degrees[i]++; degrees[j]++;
                    }
                }
                for (let i = 3; i < N; i++) {
                    let targets = [];
                    let totalDeg = degrees.reduce((a, b) => a + b, 0) || 1;
                    while (targets.length < 2) {
                        for (let j = 0; j < i; j++) {
                            if (!targets.includes(j) && Math.random() < (degrees[j] + 1) / totalDeg) {
                                targets.push(j);
                                if (targets.length >= 2) break;
                            }
                        }
                    }
                    targets.forEach(t => {
                        links.push({ source: i, target: t, severed: false });
                        degrees[i]++; degrees[t]++;
                    });
                }
            } else if (topology === "erdos_renyi") {
                for (let i = 0; i < N; i++) {
                    for (let j = i + 1; j < N; j++) {
                        if (Math.random() < 0.05) links.push({ source: i, target: j, severed: false });
                    }
                }
            } else {
                for (let i = 0; i < N; i++) {
                    for (let j = 1; j <= 2; j++) {
                        links.push({ source: i, target: (i + j) % N, severed: false });
                    }
                }
            }

            let degMap = new Map();
            nodes.forEach(n => degMap.set(n.id, 0));
            links.forEach(l => {
                let s = typeof l.source === "object" ? l.source.id : l.source;
                let t = typeof l.target === "object" ? l.target.id : l.target;
                degMap.set(s, degMap.get(s) + 1);
                degMap.set(t, degMap.get(t) + 1);
            });

            nodes.forEach(n => {
                let load = Math.max(1, degMap.get(n.id));
                n.load = load;
                n.capacity = load * (1.0 + alpha);
                n.status = "healthy";
            });

            step = 0;
            stepHistory = [];
            recordStepHistory();
            updateMetrics();
            drawGraph();
        }

        function drawGraph() {
            container.selectAll("*").remove();

            const link = container.append("g")
                .selectAll("line")
                .data(links)
                .join("line")
                .attr("class", d => `edge ${d.severed ? 'severed' : ''}`)
                .on("mouseover", function (e, d) {
                    if (interactionMode === "cut") {
                        d3.select(this).classed("hover-cut", true);
                    }
                })
                .on("mouseout", function () {
                    d3.select(this).classed("hover-cut", false);
                })
                .on("click", (e, d) => {
                    if (interactionMode === "cut") {
                        d.severed = !d.severed;
                        drawGraph();
                    }
                });

            const node = container.append("g")
                .selectAll("circle")
                .data(nodes)
                .join("circle")
                .attr("class", "node")
                .attr("r", d => Math.max(5, Math.sqrt(d.capacity) * 2.8))
                .attr("fill", d => getNodeColor(d))
                .call(d3.drag()
                    .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
                    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
                    .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

            node.on("click", (e, d) => {
                if (interactionMode === "shock") {
                    if (d.status === "healthy") {
                        d.status = "failed";
                        triggerShockWave(d);
                        step = Math.max(1, step);
                        recordStepHistory();
                        updateVisuals();
                        updateMetrics();
                    }
                }
            });

            node.on("mouseover", (e, d) => {
                const remBuf = (d.capacity - d.load).toFixed(2);
                const bufStr = d.status === "failed" ? "0.00 (FAILED)" : (remBuf >= 0 ? `+${remBuf}` : `${remBuf} (OVERLOAD)`);
                d3.select("#tooltip")
                    .style("opacity", 1)
                    .style("left", (e.pageX + 12) + "px")
                    .style("top", (e.pageY - 12) + "px")
                    .html(`Node #${d.id}<br/>Status: ${d.status.toUpperCase()}<br/>Load: ${d.load.toFixed(2)} / ${d.capacity.toFixed(2)}<br/>Buffer Margin: ${bufStr}`);
            }).on("mouseout", () => d3.select("#tooltip").style("opacity", 0));

            simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(45))
                .force("charge", d3.forceManyBody().strength(-110))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .on("tick", () => {
                    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                    node.attr("cx", d => d.x).attr("cy", d => d.y);
                });
        }

        function triggerShockWave(d) {
            container.append("circle")
                .attr("cx", d.x || width / 2)
                .attr("cy", d.y || height / 2)
                .attr("r", Math.max(5, Math.sqrt(d.capacity) * 2.8))
                .attr("fill", "none")
                .attr("stroke", "#dc2626")
                .attr("stroke-width", 3)
                .transition().duration(500)
                .attr("r", 45)
                .style("opacity", 0)
                .remove();
        }

        function animateFlowParticle(source, target) {
            if (!source.x || !target.x) return;
            container.append("circle")
                .attr("class", "flow-particle")
                .attr("cx", source.x)
                .attr("cy", source.y)
                .attr("r", 4)
                .attr("fill", "#f59e0b")
                .transition()
                .duration(420)
                .ease(d3.easeQuadOut)
                .attr("cx", target.x)
                .attr("cy", target.y)
                .remove();
        }

        function getNodeColor(d) {
            if (d.status === "failed") return "#dc2626";
            if (d.load / d.capacity > 0.85) return "#d97706";
            return "#2563eb";
        }

        function triggerAttack() {
            const strat = document.getElementById("attack").value;
            let target;
            if (strat === "target_hub") {
                target = nodes.filter(n => n.status === "healthy").sort((a, b) => b.load - a.load)[0];
            } else {
                let healthy = nodes.filter(n => n.status === "healthy");
                target = healthy[Math.floor(Math.random() * healthy.length)];
            }

            if (target) {
                target.status = "failed";
                triggerShockWave(target);
                step = 1;
                recordStepHistory();
                updateVisuals();
                updateMetrics();
            }
        }

        function stepCascade() {
            let newlyFailed = nodes.filter(n => n.status === "failed" && n.load > 0);
            if (newlyFailed.length === 0) {
                if (isPlaying) togglePlay();
                return;
            }

            step++;
            newlyFailed.forEach(fNode => {
                let shed = fNode.load;
                fNode.load = 0;
                let activeLinks = links.filter(l => !l.severed && (l.source.id === fNode.id || l.target.id === fNode.id));
                let neighbors = activeLinks
                    .map(l => l.source.id === fNode.id ? l.target : l.source)
                    .filter(nbr => nbr.status === "healthy");

                if (neighbors.length > 0 && shed > 0) {
                    let totalRem = neighbors.reduce((acc, n) => acc + Math.max(0, n.capacity - n.load), 0);
                    neighbors.forEach(nbr => {
                        let rem = Math.max(0, nbr.capacity - nbr.load);
                        let share = totalRem > 0 ? shed * (rem / totalRem) : shed / neighbors.length;
                        nbr.load += share;
                        animateFlowParticle(fNode, nbr);
                    });
                }
            });

            nodes.forEach(n => {
                if (n.status === "healthy" && n.load > n.capacity) {
                    n.status = "failed";
                    triggerShockWave(n);
                }
            });

            recordStepHistory();
            updateVisuals();
            updateMetrics();
        }

        function recordStepHistory() {
            const failed = nodes.filter(n => n.status === "failed").length;
            const pct = (failed / nodes.length) * 100;
            const giantCC = 1.0 - (failed / nodes.length);
            stepHistory.push({ step, failedPct: pct, giantCC });
            renderTrajectoryChart();
        }

        function renderTrajectoryChart() {
            const chartSvg = d3.select("#chart-svg");
            chartSvg.selectAll("*").remove();

            const cW = 220, cH = 42;
            const maxS = Math.max(5, ...stepHistory.map(d => d.step));

            const xScale = d3.scaleLinear().domain([0, maxS]).range([4, cW - 4]);
            const yScalePct = d3.scaleLinear().domain([0, 100]).range([cH - 4, 4]);
            const yScaleGiant = d3.scaleLinear().domain([0, 1]).range([cH - 4, 4]);

            const linePct = d3.line().x(d => xScale(d.step)).y(d => yScalePct(d.failedPct)).curve(d3.curveMonotoneX);
            const lineGiant = d3.line().x(d => xScale(d.step)).y(d => yScaleGiant(d.giantCC)).curve(d3.curveMonotoneX);

            chartSvg.append("path")
                .datum(stepHistory)
                .attr("fill", "none")
                .attr("stroke", "#2563eb")
                .attr("stroke-width", 1.5)
                .attr("d", lineGiant);

            chartSvg.append("path")
                .datum(stepHistory)
                .attr("fill", "none")
                .attr("stroke", "#dc2626")
                .attr("stroke-width", 1.5)
                .attr("d", linePct);
        }

        function updateVisuals() {
            container.selectAll(".node")
                .transition().duration(200)
                .attr("fill", d => getNodeColor(d));
        }

        function updateMetrics() {
            const failed = nodes.filter(n => n.status === "failed").length;
            const pct = ((failed / nodes.length) * 100).toFixed(1);
            document.getElementById("m-step").textContent = step;
            document.getElementById("m-failed").textContent = `${failed} / ${nodes.length} (${pct}%)`;
            document.getElementById("m-giant").textContent = (1 - (failed / nodes.length)).toFixed(3);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById("btn-play").textContent = isPlaying ? "Pause" : "Auto Play";
            if (isPlaying) timer = setInterval(stepCascade, 500);
            else clearInterval(timer);
        }

        // Export Functions
        document.getElementById("btn-export-svg").addEventListener("click", () => {
            const svgNode = document.getElementById("canvas");
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svgNode);
            const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `cascade_graph_step_${step}.svg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        document.getElementById("btn-export-json").addEventListener("click", () => {
            const payload = {
                topology: document.getElementById("topology").value,
                nodes_count: nodes.length,
                alpha: parseFloat(document.getElementById("alpha").value),
                step: step,
                step_history: stepHistory,
                severed_links_count: links.filter(l => l.severed).length,
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `cascade_telemetry_step_${step}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // Event Listeners
        document.getElementById("btn-init").addEventListener("click", generateNetwork);
        document.getElementById("btn-attack").addEventListener("click", triggerAttack);
        document.getElementById("btn-step").addEventListener("click", stepCascade);
        document.getElementById("btn-play").addEventListener("click", togglePlay);

        // Keyboard Shortcuts
        window.addEventListener("keydown", (e) => {
            if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
            if (e.code === "Space") {
                e.preventDefault();
                togglePlay();
            } else if (e.code === "KeyS" || e.key === "s" || e.key === "S") {
                stepCascade();
            } else if (e.code === "KeyR" || e.key === "r" || e.key === "R") {
                generateNetwork();
            }
        });

        generateNetwork();
    </script>
</body>
</html>
